[package]
name = "rein-agent"
version.workspace = true
edition.workspace = true
description = "The agent loop and tools for the rein agent harness"

[dependencies]
rein-llm = { version = "0.1.0", path = "../rein-llm" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt", "time"] }
