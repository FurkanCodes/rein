[package]
name = "rein-agent"
version.workspace = true
edition.workspace = true
description = "The agent loop and tools for the rein agent harness"

[dependencies]
libc = "0.2.191"
png = "0.18"
rein-llm = { version = "0.1.0", path = "../rein-llm" }
rein-mcp = { version = "0.1.0", path = "../rein-mcp" }
rein-sandbox = { version = "0.1.0", path = "../rein-sandbox" }
regex-lite = "0.1.9"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt", "time"] }

[dev-dependencies]
rein-mcp = { version = "0.1.0", path = "../rein-mcp", features = ["test-support"] }
rein-sandbox = { version = "0.1.0", path = "../rein-sandbox", features = ["test-support"] }
