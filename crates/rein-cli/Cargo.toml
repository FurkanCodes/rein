[package]
name = "rein-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "rein: a tiny, fast agent harness. You hold the reins."

[dependencies]
rein-agent = { version = "0.1.0", path = "../rein-agent" }
rein-llm = { version = "0.1.0", path = "../rein-llm" }
rein-mcp = { version = "0.1.0", path = "../rein-mcp" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "signal", "sync", "net", "io-util", "io-std"] }

[[bin]]
name = "rein"
path = "src/main.rs"

[dev-dependencies]
rein-mcp = { version = "0.1.0", path = "../rein-mcp", features = ["test-support"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# A terminal on screen in memory, for the tests that run rein in one.
vt100 = "0.16.2"
