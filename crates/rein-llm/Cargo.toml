[package]
name = "rein-llm"
version.workspace = true
edition.workspace = true
description = "Streaming LLM provider layer for the rein agent harness"

[dependencies]
base64 = "0.23.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "macros", "sync", "process"] }
libc = "0.2"
