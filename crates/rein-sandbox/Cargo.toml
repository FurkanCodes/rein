[package]
name = "rein-sandbox"
version.workspace = true
edition.workspace = true
description = "The walls rein's commands run inside: what they may change, read and reach"

[features]
# `Sandbox::assume`, for other crates' tests that decide by a sandbox
# without running anything in it.
test-support = []

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["process", "time"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "process", "rt", "time"] }
