[package]
name = "rein-mcp"
version.workspace = true
edition.workspace = true
description = "MCP servers for rein: started in its sandbox, their tools offered to the model"

[features]
# `FAKE_SERVER`, a small MCP server for other crates' tests.
test-support = []

[dependencies]
rein-sandbox = { version = "0.1.0", path = "../rein-sandbox" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
