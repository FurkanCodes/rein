# The throwaway test window: a workspace of its own, so nothing of GPUI's
# reaches rein's dependencies or its checks.
[workspace]
resolver = "3"
members = ["replay", "transcript", "window"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
debug = "line-tables-only"
