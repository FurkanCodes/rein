[package]
name = "rein-window"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Longbridge's faster GPUI, which calls itself experimental: the gates run
# with and without it.
fast = ["gpui-kit/gpui-fast"]

[dependencies]
# Exactly: a patch release can move the GPUI snapshot under it.
gpui-kit = "=0.9.0"
rein-transcript = { path = "../transcript" }
serde_json = "1"
futures = "0.3"
base64 = "0.23"
# A TIFF is all some copied images are, and no provider takes one.
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }

[dev-dependencies]
# Exactly what gpui-kit runs on, for a window with no GPU behind it.
gpui-pre = { version = "=0.3.11", features = ["test-support"] }
