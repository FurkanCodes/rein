# gpui-pre's `test-support` names this crate, and 0.3.11 of it was never
# published, so a window can't be tested without something by this name.
# Nothing uses it: the feature that would is off.
[package]
name = "gpui-pre-bench-metrics"
version = "0.3.11"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[features]
test-support = []
